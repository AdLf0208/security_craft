[package]
# Port of SecurityCraft 1.10.2.1 (Geforce132/SecurityCraft, commit
# c4d35b0c8bf85c2a94c37a1f8ce37ef5ce1a6aa8, MIT). Minecraft Java 1.21.1
# NeoForge; the port targets Horizon 26.3 at the SDK build horizon-mod.toml
# pins. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md);
# local-only until publishing is approved, publishable under MIT with this
# source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "securitycraft"
version = "0.2.14"
edition = "2024"
license = "MIT"
description = "SecurityCraft for Horizon: the keypad, the reinforced door, the passcode barrel, and the harming, allowlist, denylist, smart and disguise modules"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). This is the package's **only**
# dependency: the registry refuses any other (tools/native-subset/src/manifests.rs, R9), so the
# keypad's salted SHA-256 digest is this port's own code in `src/runtime.rs` and no lock travels
# with the package (R10 accepts a lock only as the previous release's).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
