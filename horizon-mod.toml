id = "securitycraft"
name = "SecurityCraft"
version = "0.2.14"
description = """SecurityCraft's keypad and reinforced door: a keypad stores a salted digest of a typed code,
asks for it on a drawn panel of keys and, on a match, powers itself for three seconds; a reinforced
door beside it opens on that redstone signal and closes when it runs out. The keypad's placer is its
owner: only the owner may set its first code or install a module. The harming module hurts a player
who enters a wrong code; the allowlist module opens a coded keypad for a listed player without a
code, the denylist module refuses a listed player any interaction, the smart module applies the
retry cooldown after wrong codes, and the disguise module renders the keypad as a tinted block.
The passcode-protected barrel keeps a saved code and salt and opens its 27-slot container only
for its owner after the right code. The passcode-protected smoker cooks food against the game's own
smoking recipes with the same three-slot container and code gate. The passcode trapdoor is a carried
iron trapdoor whose owner's correct code flips its `open` state and whose scheduled tick closes it.
The passcode door is the matching double-high carried iron door: its owner's correct code flips
`open` on both halves and the scheduled tick closes them both.
The cameras, the mines and the lasers are not ported yet."""
authors = ["Geforce, bl4ckscor3, Redstone_Dubstep, and ChainmailPickaxe", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both (the keypad's screen is drawn
# by the client and its clicks are applied by the server).
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"). The keypad and the reinforced door are carried content, so this port really does
# register blocks.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
